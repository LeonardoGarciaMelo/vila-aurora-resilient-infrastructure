<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <email_notification>no</email_notification>
  </global>
  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>tcp</protocol>
    <allowed-ips>10.50.0.0/24</allowed-ips>
  </remote>
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
  <auth><disabled>yes</disabled></auth>
  <cluster><disabled>yes</disabled></cluster>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>

  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/cloud/vpn.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/cloud/ztna.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/cloud/vilaaurora-ingest.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/cloud/hub-firewall.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/cloud/vilaaurora-ai.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/cloud/waf-access.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/panel/vilaaurora-panel.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/pg/postgresql.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/legacy/legacy-panel-access.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/legacy/legacy-vpn-auth.log</location></localfile>
  <localfile><log_format>syslog</log_format><only-future-events>no</only-future-events><location>/vaurora/legacy/legacy-controller.log</location></localfile>
</ossec_config>
