persistence true
persistence_location /mosquitto/data/
log_dest file /var/log/vaurora/cloud-broker.log
log_timestamp_format %b %d %H:%M:%S
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
user root
allow_anonymous false
acl_file /mosquitto/config/acl
max_queued_messages 20000
listener 8883
cafile /secrets/public/ca-chain.crt
certfile /secrets/broker/server.crt
keyfile /secrets/broker/server.key
crlfile /secrets/public/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
